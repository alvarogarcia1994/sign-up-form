<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign up form</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    
    <body>
        <!-- Page structure -->
        <div class="container">
            <!-- Left side of the page which contains the sidebar with an image background ond ODIN's logo-->
            <div class="left">
                <aside class="image-sidebar">
                    <div class="brand-rectangle">
                        <img src="assets/odin-lined.png" alt="Odin Logo"/>
                        <div class="brand">ODIN</div>
                    </div>
                </aside>
            </div>
            <!-- End of the left side -->

            <!-- Right side of the page which contains three sections: top section, central section, and lower section -->
            <div class="right">
                <!-- Top section which contains a description -->
                <section class="top">
                    <div>
                        <div id="description">
                            <h2>This is not a real online service! You know you need something
                            like this in your life to help you realize your deepest dreams.
                            Sign up <em>now</em> to get started.</h2>
                        </div>
        
                        <div id="log">
                            You <em>know</em> you want to.
                        </div>
                    </div>
                </section>
                <!-- End of top section-->

                <!-- Central section of the page contains a form to validate -->
                <section class="center"> 
                    <h2>Let's do this!</h2>
                    <form id="form" action="#" method="post">
                        
                        <div class="form-group">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name" required>
                        </div>
                            
                        <div class="form-group">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name" required>
                        </div>
                            
                        <div class="form-group">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                            
                        <div class="form-group">
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="phone-number">
                        </div>

                        <div class="form-group">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </div>
                    </form>
                </section>
                <!-- End of central section -->
                
                <!-- Bottom section: contains a button to send the form -->
                <section class="bottom">
                    <button>
                        Create Account
                    </button>

                    <p>Already have an account? <a href="#">Log in</a></p>
                </section>
                <!-- End of bottom section -->
            
            <!-- End of right side of the page structure-->
            </div>
        
        <!-- End of container of the page -->
        </div>

    </body>

</html>
